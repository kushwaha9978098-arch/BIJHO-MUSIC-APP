name: BIJHO MUSIC APP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/bijho/music

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'BIJHO-MUSIC-APP'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
              id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'org.jetbrains.kotlin.plugin.compose'
          }

          android {
              namespace 'com.bijho.music'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.bijho.music'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildFeatures {
                  compose true
              }
          }

          dependencies {
              implementation platform('androidx.compose:compose-bom:2024.12.01')
              implementation 'androidx.activity:activity-compose:1.10.0'
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-tooling-preview'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
              debugImplementation 'androidx.compose.ui:ui-tooling'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="BIJHO MUSIC"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/bijho/music/MainActivity.kt <<'EOF'
          package com.bijho.music

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MusicHome()
                  }
              }
          }

          @Composable
          fun MusicHome() {
              val pink = Color(0xFFFF5EAD)
              val blue = Color(0xFF42D9FF)

              MaterialTheme {
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(
                              Brush.verticalGradient(
                                  listOf(
                                      Color(0xFF160C2C),
                                      Color(0xFF102C52),
                                      Color(0xFF170E30)
                                  )
                              )
                          )
                          .padding(20.dp),
                      contentAlignment = Alignment.Center
                  ) {
                      Column(
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.spacedBy(18.dp)
                      ) {
                          Text("♫", color = pink, fontSize = 64.sp)
                          Text(
                              "BIJHO MUSIC",
                              color = Color.White,
                              fontSize = 30.sp,
                              fontWeight = FontWeight.Bold
                          )
                          Text(
                              "YOUR MUSIC • YOUR VIBE",
                              color = blue,
                              fontSize = 13.sp
                          )
                          Card(
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(24.dp),
                              colors = CardDefaults.cardColors(
                                  containerColor = Color(0x443B75A8)
                              )
                          ) {
                              Column(
                                  modifier = Modifier.padding(22.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally
                              ) {
                                  Text(
                                      "Welcome to your music world",
                                      color = Color.White,
                                      fontSize = 19.sp,
                                      fontWeight = FontWeight.SemiBold
                                  )
                                  Spacer(Modifier.height(8.dp))
                                  Text(
                                      "Pink + Blue Edition",
                                      color = blue,
                                      fontSize = 15.sp
                                  )
                                  Spacer(Modifier.height(18.dp))
                                  Button(
                                      onClick = {},
                                      colors = ButtonDefaults.buttonColors(
                                          containerColor = pink
                                      )
                                  ) {
                                      Text("MUSIC APP", color = Color.White)
                                  }
                              }
                          }
                          Text(
                              "Made for music lovers",
                              color = Color.LightGray,
                              fontSize = 13.sp
                          )
                      }
                  }
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIJHO-MUSIC-APP-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
